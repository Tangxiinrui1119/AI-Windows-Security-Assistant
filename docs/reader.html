<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · AI Windows 安全助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --bg:#06090f; --panel:#0a1120; --panel2:#0d1626;
  --border:#1b2a45; --border-hi:#2e466e;
  --green:#3df5b0; --cyan:#53c8ff; --purple:#9d7bff;
  --text:#dbe7f5; --dim:#8596b3; --faint:#5a6884;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;line-height:1.8}
a{color:inherit}
.bg{position:fixed;inset:0;z-index:-2;
  background-image:
    radial-gradient(ellipse 90% 55% at 50% -12%, rgba(83,200,255,.14), transparent 70%),
    radial-gradient(ellipse 55% 42% at 88% 108%, rgba(61,245,176,.08), transparent 70%),
    linear-gradient(rgba(83,200,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(83,200,255,.045) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,46px 46px,46px 46px}
.scan{position:fixed;inset:0;z-index:99;pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px)}
.wrap{max-width:940px;margin:0 auto;padding:0 22px 60px}
/* 顶栏 */
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;flex-wrap:wrap;gap:10px}
.logo{font-family:var(--mono);font-size:14px;color:var(--cyan);letter-spacing:.5px}
.logo b{color:var(--text)}
.nav{display:flex;gap:10px}
.gh-link{font-family:var(--mono);font-size:13px;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:6px 14px;transition:.25s}
.gh-link:hover{color:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(61,245,176,.25)}
/* 路径条 */
.path{font-family:var(--mono);font-size:13px;color:var(--green);margin-top:26px;border:1px solid var(--border);border-left:3px solid var(--green);border-radius:8px;padding:10px 16px;background:var(--panel);word-break:break-all}
/* 正文 */
.doc{max-width:860px;margin:30px auto 0}
.loading{font-family:var(--mono);color:var(--dim);font-size:15px}
.cursor{display:inline-block;color:var(--green);animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.errbox{border:1px solid var(--border-hi);border-radius:14px;background:var(--panel);padding:28px;font-family:var(--mono)}
.errbox .e1{color:#ff8b8b;font-size:15px;margin-bottom:12px}
.errbox .e2{color:var(--dim);font-size:13.5px;margin-top:6px}
.errbox a{color:var(--cyan)}
/* Markdown 渲染 */
.md h1{font-size:clamp(24px,4.5vw,36px);line-height:1.3;letter-spacing:2px;margin:8px 0 22px;font-weight:800;
  background:linear-gradient(92deg,var(--cyan) 10%,var(--green) 55%,var(--purple) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.md h2{font-size:22px;margin:44px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border);letter-spacing:1px}
.md h2::before{content:"# ";color:var(--green);font-family:var(--mono)}
.md h3{font-size:17px;margin:28px 0 10px;color:var(--cyan)}
.md h3::before{content:"## ";color:var(--green);font-family:var(--mono);opacity:.8}
.md h4{font-size:15px;margin:20px 0 8px;color:var(--text)}
.md p{margin:12px 0;color:var(--text)}
.md strong{color:#fff}
.md em{color:var(--dim)}
.md ul,.md ol{margin:12px 0;padding-left:26px}
.md li{margin:5px 0}
.md li::marker{color:var(--green);font-family:var(--mono)}
.md a{color:var(--cyan);text-decoration:none;border-bottom:1px dashed rgba(83,200,255,.4);transition:.2s}
.md a:hover{color:var(--green);border-bottom-color:var(--green)}
.md blockquote{margin:16px 0;padding:12px 18px;border-left:3px solid var(--green);background:rgba(61,245,176,.05);border-radius:0 10px 10px 0;color:var(--dim)}
.md blockquote p{margin:4px 0;color:var(--dim)}
.md code{font-family:var(--mono);font-size:.88em;background:rgba(83,200,255,.09);color:var(--cyan);padding:2px 7px;border-radius:6px}
.md pre{margin:16px 0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;overflow-x:auto}
.md pre code{background:none;color:#b8e6ff;padding:0;font-size:13.5px;line-height:1.7}
.md table{margin:16px 0;width:100%;border-collapse:collapse;font-size:14px}
.md th{background:rgba(83,200,255,.09);color:var(--cyan);font-family:var(--mono);font-weight:600;letter-spacing:.5px}
.md th,.md td{border:1px solid var(--border);padding:9px 14px;text-align:left}
.md td{color:var(--dim)}
.md tbody tr:hover{background:rgba(255,255,255,.02)}
.md hr{border:none;height:1px;margin:30px 0;background:linear-gradient(90deg,transparent,var(--border-hi),transparent)}
.md img{max-width:100%;border-radius:10px;border:1px solid var(--border)}
/* 页脚 */
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--faint);font-size:13px}
footer .quote{color:var(--dim);font-size:14px;margin-bottom:8px}
footer .quote b{color:var(--green)}
footer a:hover{color:var(--cyan)}
@media (max-width:640px){
  .md pre{margin:16px -6px}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="scan"></div>

<main class="wrap">
  <header class="top">
    <div class="logo">🛡️ <b>AI-Windows-Security-Assistant</b></div>
    <nav class="nav">
      <a class="gh-link" href="index.html">← 回到首页</a>
      <a class="gh-link" id="src-link" href="#" target="_blank" rel="noopener">GitHub 查看原文 ↗</a>
    </nav>
  </header>

  <div class="path" id="path">$ 正在解析路径…</div>

  <div class="doc" id="doc">
    <p class="loading">$ 正在加载文档 <span class="cursor">▊</span></p>
  </div>

  <footer>
    <p class="quote">「不追求每天完成很多，追求<b>一直做</b>。」</p>
    <p>AI Windows 安全助手 · 由 <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a> 驱动</p>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
if (!window.marked) {
  document.write('<script src="https://unpkg.com/marked@12/marked.min.js"><\/script>');
}
</script>
<script>
(function () {
  var REPO = 'Tangxiinrui1119/AI-Windows-Security-Assistant';
  var RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/';
  var GH_BLOB = 'https://github.com/' + REPO + '/blob/main/';
  var GH_TREE = 'https://github.com/' + REPO + '/tree/main/';

  var doc = document.getElementById('doc');
  var pathEl = document.getElementById('path');
  var srcLink = document.getElementById('src-link');

  // 只允许仓库内的白名单路径，防止任意 URL
  function cleanPath(p) {
    if (!p) return 'docs/PLAN.md';
    p = String(p).replace(/\\/g, '/');
    if (/^(https?:)?\/\//i.test(p) || p.indexOf('/') === 0) return null;
    var parts = [];
    p.split('/').forEach(function (seg) {
      if (seg === '' || seg === '.') return;
      if (seg === '..') { parts.pop(); return; }
      parts.push(seg);
    });
    var cleaned = parts.join('/');
    var ok = cleaned === 'README.md' ||
      cleaned.indexOf('docs/') === 0 ||
      cleaned.indexOf('notes/') === 0 ||
      cleaned.indexOf('project/') === 0;
    return ok ? cleaned : null;
  }

  // 相对路径解析（支持 ../ ./ #锚点 ?参数）
  function resolvePath(baseDir, href) {
    var hash = '', query = '';
    var h = href.indexOf('#');
    if (h >= 0) { hash = href.slice(h); href = href.slice(0, h); }
    var q = href.indexOf('?');
    if (q >= 0) { query = href.slice(q); href = href.slice(0, q); }
    var base = href.indexOf('/') === 0 ? [] : baseDir.split('/').filter(Boolean);
    href.split('/').forEach(function (s) {
      if (s === '' || s === '.') return;
      if (s === '..') { base.pop(); return; }
      base.push(s);
    });
    return base.join('/') + query + hash;
  }

  function showError(file) {
    var url = file ? GH_BLOB + file : GH_TREE;
    doc.innerHTML = '<div class="errbox">' +
      '<p class="e1">$ 加载失败 —— 网络不可用，或文件不存在</p>' +
      (file ? '<p class="e2">文件：' + file + '</p>' : '') +
      '<p class="e2">可以到 GitHub 直接查看：<a href="' + url + '" target="_blank" rel="noopener">打开原文 ↗</a></p>' +
      '<p class="e2"><a href="index.html">← 回到首页</a></p>' +
      '</div>';
  }

  function render(md, file) {
    if (!window.marked) { showError(file); return; }
    var baseDir = file.slice(0, file.lastIndexOf('/') + 1);
    var html = marked.parse(md);
    doc.innerHTML = '<div class="md">' + html + '</div>';

    var h1 = doc.querySelector('.md h1');
    if (h1) document.title = h1.textContent.trim() + ' · AI Windows 安全助手';

    // 内部 Markdown 链接 → 阅读器；其他相对链接 → GitHub
    doc.querySelectorAll('.md a[href]').forEach(function (a) {
      var href = a.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href) || href.charAt(0) === '#' ||
          href.indexOf('mailto:') === 0 || href.indexOf('javascript:') === 0) return;
      var res = resolvePath(baseDir, href);
      var p = res.split(/[?#]/)[0];
      if (/\.md$/i.test(p)) {
        a.setAttribute('href', 'reader.html?f=' + encodeURIComponent(p) + res.slice(p.length));
        a.removeAttribute('target');
      } else {
        a.setAttribute('href', GH_TREE + res);
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
      }
    });

    // 相对图片 → raw 地址
    doc.querySelectorAll('.md img[src]').forEach(function (im) {
      var src = im.getAttribute('src') || '';
      if (/^https?:\/\//i.test(src)) return;
      im.src = RAW + resolvePath(baseDir, src);
    });
  }

  var file = cleanPath(new URLSearchParams(location.search).get('f'));
  if (!file) {
    pathEl.textContent = '$ 非法路径 —— 已忽略';
    showError(null);
    return;
  }
  pathEl.textContent = '$ cat ' + file;
  srcLink.href = GH_BLOB + file;

  fetch(RAW + file)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (md) { render(md, file); })
    .catch(function () { showError(file); });
})();
</script>
</body>
</html>
